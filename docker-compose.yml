services:
  postgres:
    image: postgres:16-alpine
    container_name: uaps-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: uaps
      POSTGRES_USER: uaps
      POSTGRES_PASSWORD: uaps
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - uaps-postgres-data:/var/lib/postgresql/data
      - ./packages/db/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -p 5432 -U $$POSTGRES_USER -d $$POSTGRES_DB",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  uaps-postgres-data:
    name: uaps-postgres-data
